[package]
name = "renpyfmt"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/kobaltcore/renpyfmt"
homepage = "https://github.com/kobaltcore/renpyfmt"
description = "An opinionated source code formatter for Ren'Py script."
license = "MIT"

[dependencies]
toml = "1.1.8"
regex = "1.13.1"
rayon = "1.12.0"
walkdir = "2.5.0"
anyhow = "1.0.104"
pathdiff = "0.2.3"
etcetera = "0.11.0"
derivative = "2.2.0"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = { version = "0.18.6", default-features = false }
tower-lsp = "0.20.0"
tokio = { version = "1.53.3", features = ["full"] }
ruff_formatter = { git = "https://github.com/astral-sh/ruff.git", tag = "0.17.1" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", tag = "0.17.1" }
ruff_python_formatter = { git = "https://github.com/astral-sh/ruff.git", tag = "0.17.1" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "0.17.1" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", tag = "0.17.1" }

[dev-dependencies]
criterion = "0.8.2"
futures = "0.3.34"
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }

[[bench]]
name = "logical_lines"
harness = false

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "formatter"
harness = false

[[bench]]
name = "end_to_end"
harness = false

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
strip = true

[profile.release]
strip = true
opt-level = 3
codegen-units = 16
lto = "thin"
